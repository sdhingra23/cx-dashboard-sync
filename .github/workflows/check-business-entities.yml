name: Check Business Entities

# One-off diagnostic — not on a schedule. Run manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  check:
    name: List Chargebee Business Entities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run script
        env:
          CHARGEBEE_API_KEY: ${{ secrets.CHARGEBEE_API_KEY }}
        run: node scripts/check-business-entities.js
