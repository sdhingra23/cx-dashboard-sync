name: Check Name Mismatch

# One-off diagnostic — not on a schedule. Run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      customer_id:
        description: 'Chargebee customer ID to check'
        type: string
        required: true

jobs:
  check:
    name: Compare Chargebee company name against HubSpot HM Account name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run script
        env:
          CHARGEBEE_API_KEY: ${{ secrets.CHARGEBEE_API_KEY }}
          HUBSPOT_API_KEY:   ${{ secrets.HUBSPOT_API_KEY }}
        run: node scripts/check-name-mismatch.js "${{ inputs.customer_id }}"
