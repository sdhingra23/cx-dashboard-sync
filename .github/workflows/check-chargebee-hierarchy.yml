name: Check Chargebee Hierarchy

# One-off diagnostic — not on a schedule. Run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many paying customers to check (or "all" for the full book)'
        type: string
        default: '300'

jobs:
  check:
    name: Check Chargebee Account Hierarchy usage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run script
        env:
          CHARGEBEE_API_KEY: ${{ secrets.CHARGEBEE_API_KEY }}
        run: node scripts/check-chargebee-hierarchy.js --sample "${{ inputs.sample }}"
