name: Check Name Unfiltered

# One-off diagnostic — not on a schedule. Run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      search_term:
        description: 'Name (or part of one) to search for, any Chargebee status'
        type: string
        required: true

jobs:
  check:
    name: Search Chargebee customers with no status filter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run script
        env:
          CHARGEBEE_API_KEY: ${{ secrets.CHARGEBEE_API_KEY }}
        run: node scripts/check-name-unfiltered.js "${{ inputs.search_term }}"
