name: Compare HubSpot Account Totals

# One-off diagnostic — not on a schedule. Run manually from the Actions tab.
# Output shows up in this run's job log (see the "Run script" step).
on:
  workflow_dispatch:

jobs:
  compare:
    name: Compare HubSpot HM Account vs Chargebee totals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run script
        env:
          HUBSPOT_API_KEY:   ${{ secrets.HUBSPOT_API_KEY }}
          CHARGEBEE_API_KEY: ${{ secrets.CHARGEBEE_API_KEY }}
        run: node scripts/compare-hubspot-account-totals.js
