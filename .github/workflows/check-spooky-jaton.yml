name: Check Spooky/Jaton Duplicate Account

# One-off diagnostic — not on a schedule. Run manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  check:
    name: Compare Dunkin Donuts Spooky Donuts LLC vs Dunkin Jaton Mgmt Co LLC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run script
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: node scripts/check-spooky-jaton.js
